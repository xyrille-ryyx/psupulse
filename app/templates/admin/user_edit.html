{% extends "base.html" %}
{% block page_title %}Edit {{ user.username }}{% endblock %}
{% block page_subtitle %}{{ user.role_label }}{% endblock %}
{% block content %}
{% set mine = user.units|map(attribute='id')|list %}
<form class="card" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="grid grid-2">
    <div>
      <div class="field"><label for="fn">Full name</label><input id="fn" name="full_name" type="text" value="{{ user.full_name }}" required></div>
      <div class="field"><label for="em">Email</label><input id="em" name="email" type="email" value="{{ user.email or '' }}"></div>
      <div class="field"><label for="ro">Role</label>
        <select id="ro" name="role" {{ 'disabled' if user.id == current_user.id }}>
          {% for k, v in role_labels.items() %}<option value="{{ k }}" {{ 'selected' if k == user.role }}>{{ v }}</option>{% endfor %}
        </select></div>
      <div class="field"><label for="pw">Reset password</label><input id="pw" name="password" type="password" minlength="8" placeholder="Leave blank to keep the current password"></div>
    </div>
    <div class="field">
      <label for="un">Units</label>
      <select id="un" name="unit_ids" multiple size="14">
        {% for u in units %}<option value="{{ u.id }}" {{ 'selected' if u.id in mine }}>{{ u.code }} — {{ u.name }} ({{ u.unit_type }})</option>{% endfor %}
      </select>
      <div class="hint">Hold Ctrl to select several.</div>
    </div>
  </div>
  <div class="actions"><button class="btn" type="submit">Save changes</button><a class="btn btn-ghost" href="{{ url_for('admin.users') }}">Cancel</a></div>
</form>
{% endblock %}
