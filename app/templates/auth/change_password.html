{% extends "base.html" %}
{% block page_title %}Change password{% endblock %}
{% block page_subtitle %}{% endblock %}
{% block content %}
<div class="card" style="max-width:460px">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="cp">Current password</label><input id="cp" name="current_password" type="password" required autocomplete="current-password"></div>
    <div class="field"><label for="np">New password</label><input id="np" name="new_password" type="password" minlength="8" required autocomplete="new-password"><div class="hint">At least 8 characters.</div></div>
    <div class="field"><label for="cf">Confirm new password</label><input id="cf" name="confirm_password" type="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
